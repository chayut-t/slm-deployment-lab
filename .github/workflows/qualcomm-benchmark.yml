name: Qualcomm AI Hub benchmark

on:
  workflow_dispatch:
    inputs:
      target:
        description: Qualcomm target represented by the private request bundle
        required: true
        type: choice
        options:
          - snapdragon-x-elite
          - dragonwing-iq-9075
          - snapdragon-8-elite
      context:
        description: Static prompt/cache context length
        required: true
        type: choice
        options:
          - "128"
          - "512"
          - "1024"
          - "4096"
      precision:
        description: Precision represented by the selected artifact
        required: true
        type: choice
        options:
          - fp16
          - w8a16
          - w8a8
          - w4a8
      stage:
        description: One independently restartable AI Hub stage
        required: true
        type: choice
        options:
          - compile
          - inference
          - profile
      request_artifact_run_id:
        description: Successful default-branch run containing qualcomm-request-bundle
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qualcomm-ai-hub-${{ inputs.target }}-${{ inputs.context }}-${{ inputs.precision }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate trusted dispatch and bundle provenance
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.event.repository.fork == false &&
        github.ref == format(
          'refs/heads/{0}',
          github.event.repository.default_branch
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request-artifact-run-id: ${{ steps.provenance.outputs.run-id }}
    steps:
      - name: Validate fixed inputs and trusted artifact run
        id: provenance
        env:
          API_URL: ${{ github.api_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_ARTIFACT_RUN_ID: ${{ inputs.request_artifact_run_id }}
          TARGET: ${{ inputs.target }}
          CONTEXT: ${{ inputs.context }}
          PRECISION: ${{ inputs.precision }}
          STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            snapdragon-x-elite|dragonwing-iq-9075|snapdragon-8-elite) ;;
            *) echo "unsupported target" >&2; exit 2 ;;
          esac
          case "$CONTEXT" in
            128|512|1024|4096) ;;
            *) echo "unsupported context" >&2; exit 2 ;;
          esac
          case "$PRECISION" in
            fp16|w8a16|w8a8|w4a8) ;;
            *) echo "unsupported precision" >&2; exit 2 ;;
          esac
          case "$STAGE" in
            compile|inference|profile) ;;
            *) echo "unsupported stage" >&2; exit 2 ;;
          esac
          case "$REQUEST_ARTIFACT_RUN_ID" in
            ""|*[!0-9]*) echo "artifact run ID must be numeric" >&2; exit 2 ;;
          esac
          if [ "$REQUEST_ARTIFACT_RUN_ID" -eq 0 ]; then
            echo "artifact run ID must be positive" >&2
            exit 2
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
              f"/actions/runs/{os.environ['REQUEST_ARTIFACT_RUN_ID']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
          except Exception:
              raise SystemExit("could not validate artifact run provenance") from None

          head_repository = run.get("head_repository") or {}
          trusted = (
              run.get("conclusion") == "success"
              and run.get("head_branch") == os.environ["DEFAULT_BRANCH"]
              and head_repository.get("full_name") == os.environ["REPOSITORY"]
              and run.get("event") in {"push", "workflow_dispatch"}
          )
          if not trusted:
              raise SystemExit(
                  "artifact run must be a successful same-repository "
                  "default-branch push or manual run"
              )
          PY
          echo "run-id=$REQUEST_ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"

  submit:
    name: Run ${{ inputs.stage }} on ${{ inputs.target }}
    needs: authorize
    environment: qualcomm-ai-hub
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the reviewed default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11.13"
          cache: pip

      - name: Install the pinned AI Hub client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "qai-hub==0.53.0"
          python -c \
            'import importlib.metadata; assert importlib.metadata.version("qai-hub") == "0.53.0"'

      - name: Download the trusted private request bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: qualcomm-request-bundle
          path: artifacts/qualcomm-request-bundle
          repository: ${{ github.repository }}
          run-id: ${{ needs.authorize.outputs.request-artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Select the fixed local stage script and request
        id: selection
        env:
          TARGET: ${{ inputs.target }}
          CONTEXT: ${{ inputs.context }}
          PRECISION: ${{ inputs.precision }}
          STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGE" in
            compile) script="scripts/qualcomm/compile.py" ;;
            inference) script="scripts/qualcomm/inference.py" ;;
            profile) script="scripts/qualcomm/profile.py" ;;
            *) echo "unsupported stage" >&2; exit 2 ;;
          esac
          request_dir="artifacts/qualcomm-request-bundle"
          request_dir="$request_dir/$TARGET/$CONTEXT/$PRECISION"
          request="$request_dir/$STAGE-request.json"
          if [ ! -f "$request" ]; then
            echo "selected request is absent from the bundle" >&2
            exit 2
          fi
          manifest_dir="results/qualcomm-actions"
          manifest_dir="$manifest_dir/$TARGET/$CONTEXT/$PRECISION"
          mkdir -p "$manifest_dir"
          {
            echo "script=$script"
            echo "request=$request"
            echo "manifest=$manifest_dir/$STAGE-manifest.json"
          } >> "$GITHUB_OUTPUT"

      - name: Configure the client without printing the secret
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import configparser
          import os
          from pathlib import Path

          from qai_hub.public_rest_api import (
              DEFAULT_HUB_API_URL,
              DEFAULT_HUB_WEB_URL,
          )

          token = os.environ.pop("QAI_HUB_API_TOKEN", "")
          if not token:
              raise SystemExit("QAI_HUB_API_TOKEN is not configured")
          config = configparser.ConfigParser()
          config["api"] = {
              "api_token": token,
              "api_url": DEFAULT_HUB_API_URL,
              "web_url": DEFAULT_HUB_WEB_URL,
              "verbose": "false",
              "client_mode": "library",
          }
          destination = Path.home() / ".qai_hub" / "client.ini"
          destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          with destination.open("w", encoding="utf-8") as handle:
              config.write(handle)
          destination.chmod(0o600)
          PY

      - name: Execute the selected local T30 adapter
        env:
          MANIFEST: ${{ steps.selection.outputs.manifest }}
          REQUEST: ${{ steps.selection.outputs.request }}
          SCRIPT: ${{ steps.selection.outputs.script }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python "$SCRIPT" \
            --request "$REQUEST" \
            --manifest "$MANIFEST"

      - name: Remove the ephemeral client credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          config_path="$HOME/.qai_hub/client.ini"
          if [ -f "$config_path" ]; then
            unlink "$config_path"
          fi

      - name: Upload only the sanitized stage manifest
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: qualcomm-${{ inputs.target }}-${{ inputs.context }}-${{ inputs.precision }}-${{ inputs.stage }}-manifest
          path: ${{ steps.selection.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14
