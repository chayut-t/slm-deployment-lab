  activations:
    dtype: int8
    bits: 8
    signed: true
    symmetric: true
    zero_point: 0
    granularity: per_tensor
    range_estimator: mse
    range_estimator_reason: 'At 8 bits a symmetric per-tensor range has 128 positive
      levels, so the min-max choice that is free at int16 becomes the dominant
      error: one outlier channel sets a scale that collapses the bulk of the distribution
      onto a handful of levels. The estimator therefore has to trade clipping
      error against resolution error explicitly. An MSE-minimizing search over
      candidate thresholds does that with a stated objective and no hand-chosen
      constant, which matters here because no activation histogram has been measured
      anywhere in this repository and a hand-picked percentile would be a guess
      wearing a number.'
    rejected_range_estimators:
    - id: min_max
      reason: Guarantees no clipping and guarantees that a single outlier channel
        destroys the resolution of every other channel in the tensor. At int8
        that is the worse failure.
    - id: percentile
      reason: Workable, but requires committing to a percentile constant before
        any histogram exists. Kept as the fallback if the MSE search proves unstable
        on the attention tensors.
    sensitive_tensors:
    - id: residual_stream
      risk: The int8 activation path's primary failure mode. If this candidate
        degrades, the residual stream is the first place to grant a per-tensor
        exception.
    - id: attention_probabilities_post_softmax
      risk: Lives in [0, 1] with a long thin tail. A symmetric int8 quantizer
        spends half its range on values that cannot occur and rounds the small
        probabilities that carry the long-context contribution to zero.
    - id: mlp_down_proj_input
      risk: The SwiGLU product after the SiLU gate, reduced over the widest axis
        in the block, so activation quantization error accumulates over the longest
        dot product here.
    boundary: Nothing in this repository has measured any of these ranges. The
      sensitivity ordering above is an argument from the architecture, not a measurement,
      and the first observer pass is entitled to contradict it.
