  excluded_from_quantization:
    policy: Everything not listed here is quantized to the weight or activation
      precision declared above. Every entry names why it is excluded and whether
      the exclusion is a choice T41 is making or a constraint the frozen graph
      imposes.
    entries:
    - id: tied_embedding_table
      applies_to: the single vocabulary x hidden table
      kind: frozen_graph_constraint
      precision_kept: float16
      reason: 'configs/models/qwen3-0.6b.yaml sets tie_word_embeddings: true,
        so the embedding lookup and the final logits projection are the same stored
        tensor. They cannot be given two different precisions without untying
        them, which changes the model contract and the exported graph. This exclusion
        is expensive — the table is over a quarter of all parameters — and the
        projection states the cost rather than hiding it.'
    - id: final_logits_projection
      applies_to: the output projection that produces last_logits/next_logits
      kind: frozen_graph_constraint
      precision_kept: float16
      reason: At this model revision this is the tied table above, recorded separately
        so that an untied future revision does not silently inherit an exclusion
        it was never argued for. The T12 contract also declares the logits tensors
        float32, so the last matmul already sits on a wider output path than the
        rest of the graph.
    - id: rmsnorm_scales
      applies_to: input_layernorm, post_attention_layernorm, and the final norm
      kind: policy_choice
      precision_kept: float16
      reason: These vectors multiply the normalized residual channel by channel,
        so an int8 rounding error on them is a multiplicative error applied to
        the accumulator at every block. They are a vanishing fraction of the parameters,
        so the saving is negligible and the risk is not. The T21 inventory records
        113 ReduceMean nodes in the S128 prefill graph, which is four per block
        plus the final norm — this class and the per-head norms below account
        for all of them.
    - id: qwen3_per_head_qk_norm
      applies_to: Qwen3's per-head q_norm and k_norm scale vectors
      kind: policy_choice
      precision_kept: float16
      reason: 'Qwen3 normalizes each attention head''s query and key before RoPE,
        so these vectors act directly on the tensors whose dot product becomes
        the attention score. They are also the smallest weights in the model:
        the T21 inventory shows they are the 56 initializers the exporter left
        inline in the protobuf because each is only head_dim float16 values. Quantizing
        them would perturb attention scores to save a few kilobytes.'
    - id: softmax
      applies_to: the 28 attention softmax nodes
      kind: policy_choice
      precision_kept: float16
      reason: The input is unbounded below and the output is a probability distribution
        whose small entries are what long-context attention is made of. A symmetric
        integer quantizer on either side either wastes half its range or rounds
        the tail to zero, and the normalization itself is what makes the operator
        numerically well behaved in the first place.
    - id: rope_sin_cos
      applies_to: the RoPE sine and cosine tables
      kind: policy_choice
      precision_kept: float16
      reason: They are exact trigonometric constants that encode position. Quantizing
        them perturbs the phase applied at every position, with an error that
        grows with position index — precisely the regime the S4096 workload exercises
        hardest. The T21 inventory shows one Cos and one Sin node, so the tables
        are computed once and cost effectively nothing to keep.
    - id: residual_adds
      applies_to: the residual stream additions around attention and the MLP
      kind: policy_choice
      precision_kept: float16
      reason: The residual stream is the model's accumulator. Re-quantizing it
        at every block turns a single rounding error into a compounding one along
        all 28 layers, and it is the tensor with the widest dynamic range in the
        graph. Keeping the adds wide is the standard way to stop activation quantization
        error from accumulating with depth.
    - id: kv_cache_read_write
      applies_to: cache reads, the indexed cache write, and the cache boundary
      kind: frozen_graph_constraint
      precision_kept: float16
      reason: slm_lab.contracts.static_cache freezes CACHE_DTYPE as float16 and
        the cache crosses the graph boundary as declared inputs and outputs. The
        T21 inventory records a single ScatterND in the prefill graph, which is
        the cache write; changing its dtype changes the public contract, not an
        internal choice. The owning tasks are named in this candidate's kv_cache
        block.
    policy_choice_ids:
    - rmsnorm_scales
    - qwen3_per_head_qk_norm
    - softmax
    - rope_sin_cos
    - residual_adds
    frozen_graph_constraint_ids:
    - tied_embedding_table
    - final_logits_projection
    - kv_cache_read_write
    kind_note: 'A policy choice is revisable by T41 on evidence. A frozen-graph
      constraint is not: reversing one means changing the model contract, the
      T12 graph contract, or the T20/T23 export boundary, and those belong to
      other tasks.'
