intent: 'Answers the question that decides whether the accelerator''s integer
  MAC array is usable for this model at all: does the activation path survive
  8 bits? This is where decoder-only transformers usually break first, because
  a per-tensor int8 scale has to cover a residual stream whose largest channels
  are orders of magnitude above its typical ones. A quality result from this candidate
  is only interpretable next to the conservative candidate: together they separate
  weight error from activation error, and neither does so alone.'
