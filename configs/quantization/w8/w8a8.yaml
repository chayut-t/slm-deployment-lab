artifact_manifest_contract:
  plan_section: '17.4'
  required_fields_when_a_W8_artifact_exists:
    precision: w8a8 plus the precision state, e.g. w8a8+simulated
    quantization: the weights/activations/kv_cache blocks of this file, plus the
      exclusion policy actually applied
    calibration_dataset_revision: t40-qwen3-0.6b-t10-derived-v1+sha256.d2b749e15dd5d987
    source_artifact_sha256: the float16 graph the quantized artifact was derived
      from
  instruction: No artifact manifest may carry this candidate_id without all four.
    A manifest whose calibration_dataset_revision differs from the value above
    was calibrated on a different corpus and its quality delta is not comparable.
commands:
  generate: uv run python -m slm_lab.quantization.w8 generate
