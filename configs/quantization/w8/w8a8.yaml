      pins aimet-onnx and aimet-torch at 2.36.0. A Lane A and a Lane B W8 artifact
      would therefore not be the same artifact, and their encodings must not be
      compared as if a difference between them were a property of the model.
  lane_b_local_aimet:
    plan_section: '7.1'
    available: false
    blocked_on:
    - hardware:linux_cuda_aimet_host
    ordered_stages:
    - install the pinned AIMET environment on a Linux + CUDA host
    - run the range observers over the frozen T40 corpus
    - simulate W8 and record the quantized artifact digest
    - export ONNX, external data, and encodings
    - hand the artifact to Lane A's compile stage
    provided_by_this_repository:
    - 'environments/linux-aimet/aimet-requirements.in and .lock: hash-pinned dependency
      set'
    - 'environments/linux-aimet/aimet-cuda-wheels.lock: the CUDA wheels that cannot
      be resolved from PyPI'
    - 'environments/linux-aimet/aimet-host.template.json: the host manifest a
      real run must fill in'
    - 'configs/quantization/calibration.yaml: the frozen inputs'
    missing:
    - 'the host itself: AIMET publishes Linux x86-64 wheels only and nothing is
      installed on the primary macOS development host'
    - any executed observer pass, so no activation histogram exists anywhere in
      this repository
    pinned_versions:
      aimet-onnx: 2.36.0
      aimet-torch: 2.36.0
  boundary: 'Both lanes are unavailable at this commit, and neither is waiting
    on permission any more. Lane A is blocked on a capability this repository
    does not have — no quantize-stage adapter, in a module T22 owns — and on T31.
    Lane B is blocked on hardware. The public API can express both candidates,
    which is why the remaining gap is worth naming precisely: it is ours, not
    the service''s. Neither blocker is a code defect and neither is resolvable
    inside this task.'
