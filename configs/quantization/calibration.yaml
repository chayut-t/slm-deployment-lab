# What a reader should take away
# ------------------------------
# 1. This file freezes the *inputs* to quantization, not any quantized result.
#    No weight is quantized here; AIMET is Linux + CUDA only and is specified
#    in environments/linux-aimet/, not executed on the development host.
# 2. Tier 1 (`calibration_corpus`) is the only tier that is committed and
#    required. Every one of its samples is derived deterministically from the
#    CC0-1.0 T10 token fixtures, so the corpus regenerates byte-for-byte from
#    material already in this repository with no heavy dependency and no
#    network access.
# 3. Coverage is argued, not assumed - and the arguments are bounded by
#    measurements. Every sample carries a `rationale` saying which deployment
#    behaviour it is there to expose: all four exported prefill shapes
#    (128/512/1024/4096) because activation ranges at 128 tokens do not bound
#    those at 4096; the four raw canaries because ASCII, whitespace, Unicode
#    byte-fallback, and structured punctuation are token classes that do not
#    substitute for one another; the chat canary because the chat template
#    emits control tokens the raw-completion path never produces; and the CC0
#    quality subset because that is what the quality delta is measured on.
#    Read `calibration_corpus.coverage` first: it is computed from the emitted
#    token IDs and states how narrow the corpus really is, including that the
#    four context workloads are nested prefixes of one repeated T10 seed. No
#    rationale here claims embedding-table or vocabulary coverage, and none may.
# 4. No sample is padded. The T12 prefill contract states that
#    `attention_mask` is "One for every real prompt token; padding is not
#    permitted." Short fixtures are therefore tiled to an exact frozen prompt
#    length instead of padded - see `calibration_corpus.preprocessing.padding`
#    and `.tiling` for the full argument.
# 5. Tier 2 is declared, never committed. The three public corpora below carry
#    their real repository revisions and their real card licences, fetched from
#    the Hugging Face dataset API. Their share-alike and attribution
#    obligations are why no row of them is in this repository, and why the
#    repository stays Apache-2.0 clean.
#
# The value T41+ must copy into every artifact manifest (plan section 17.4) is
# `calibration_dataset_revision`.

