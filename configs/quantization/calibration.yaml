      scale the S1024 and S4096 workloads use, small enough to stream without
      a data pipeline, and already the de-facto reference for the perplexity T13
      will report. Widens activation coverage beyond the single repeated seed
      T10 authored.
    risk: Narrow register. Wikipedia-style prose alone under-covers the structured-output
      and chat control-token paths that tier 1 keeps.
  - id: allenai/c4
    homepage: https://huggingface.co/datasets/allenai/c4
    revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
    license:
    - odc-by
    license_obligations: ODC-BY requires attribution to the database producer
      and notice of the licence on any redistributed database or derivative database;
      it does not impose share-alike on the contents.
    data_committed: false
    assessment: 'Widest register of the three: scraped web text carries markup
      residue, code fragments, and mixed scripts, which is the closest public
      proxy for the byte-fallback and punctuation-heavy token classes the raw
      canaries probe. The least burdensome licence of the three if a derivative
      ever had to be redistributed.'
    risk: Unfiltered quality and very large shard set. Selecting a reproducible
      slice needs its own pinned selection rule, which is T41 work, not T40 work.
  - id: wikimedia/wikipedia
    homepage: https://huggingface.co/datasets/wikimedia/wikipedia
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    license:
    - cc-by-sa-3.0
    - gfdl
    license_obligations: Same CC-BY-SA-3.0 attribution and share-alike obligations
      as wikitext, plus GFDL; a committed derivative could not stay Apache-2.0.
    data_committed: false
    assessment: 'Only useful if multilingual coverage is wanted: the pre-parsed
      per-language configurations would exercise the multi-byte UTF-8 embedding
      rows the raw_unicode canary only samples. Largely redundant with wikitext
      for English-only calibration.'
    risk: Adds tens of gigabytes and the same share-alike obligations for coverage
      that overlaps wikitext; pick it only for a deliberate multilingual experiment.
licensing:
  repository_license: Apache-2.0
  model_license: Apache-2.0
  tier_1_license: CC0-1.0
  tier_1_basis: Tier 1 is a deterministic token-ID transformation of the T10 fixtures,
    which were authored for this repository and released CC0-1.0. No third-party
    text enters the corpus, so the derived corpus inherits CC0-1.0 and is compatible
    with the Apache-2.0 repository.
  tier_2_obligations:
  - 'CC-BY-SA-3.0 (Salesforce/wikitext, wikimedia/wikipedia) requires attribution
    and is share-alike: a committed derivative would have to be relicensed away
    from Apache-2.0.'
  - GFDL (Salesforce/wikitext, wikimedia/wikipedia) adds copy-of-licence and invariant-section
    obligations on redistribution.
  - ODC-BY (allenai/c4) requires attribution to the database producer and a notice
    of the licence on any redistributed database or derivative database.
  third_party_rows_committed: false
  third_party_rows_statement: No row, excerpt, or tokenization of any tier-2 dataset
    is committed to this repository. Only dataset identifiers, repository revisions,
    and licence metadata are recorded. That is why the repository remains Apache-2.0
    clean while still pinning exactly what a future calibration run would read.
  evaluation_overlap:
    overlaps: true
    scope: quality_subset (4 of 13 tier-1 samples)
    statement: The four CC0 quality prompts are both calibrated on and evaluated
      on. This is deliberate - the observers should see the distribution the delta
      is measured on - but it biases the measured quality delta optimistically,
      because the quantized model's ranges were fitted on the evaluation inputs.
      T41-T43 must report this overlap alongside any quality number, and must
      not present the delta as evidence of generalization. Admitting a tier-2
      corpus is the way to remove the overlap.
artifact_manifest_contract:
  plan_section: '17.4'
  field: calibration_dataset_revision
  value: t40-qwen3-0.6b-t10-derived-v1+sha256.d2b749e15dd5d987
  instruction: Every T41+ artifact manifest that reports a quantized result must
    carry this exact string. A manifest whose calibration_dataset_revision does
    not match the value this file regenerates was produced against a different
    corpus and its quality delta is not comparable.
commands:
  generate: uv run python -m slm_lab.quantization.calibration generate
  verify: uv run python -m slm_lab.quantization.calibration verify
  verify_online: uv run python -m slm_lab.quantization.calibration verify --online
  check: uv run python -m slm_lab.quantization.calibration check
  recompute_corpus_hash: python3 -c "import hashlib,json,yaml; c=yaml.safe_load(open('configs/quantization/calibration.yaml'))['calibration_corpus'];
    b=json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8');
    print(hashlib.sha256(b).hexdigest())"
  tests: uv run pytest tests/quantization
