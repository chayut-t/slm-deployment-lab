  - id: LEARN-08
    title: Apple Silicon and MLX
    subject: From a packaged baseline to a runtime you wrote yourself
    lede: >-
      T50 pinned MLX-LM as a versioned baseline on the M4 Mac mini and made it
      reproduce the PyTorch oracle exactly. T51 then replaced it with a custom
      Qwen3 runtime: explicit prefill and decode boundaries, fixed-capacity FP16
      caches in two layouts, and eight physical K/V heads handed straight to
      MLX's grouped-query SDPA without ever tiling them to sixteen.
    tasks: [T50, T51]
    attention: Deep study
    outcomes:
      - Explain what a fixed-capacity cache buys on unified memory, and what it
        costs.
      - Compare head-major and sequence-major K/V layouts and predict which
        loses on bandwidth.
      - Say why repeating K/V heads to match query heads is the obvious
        implementation and the wrong one.
      - Place a timer correctly around lazy evaluation — where the fence goes,
        and what is measured without one.
    readings:
      - key: baseline
        label: T50 worklog
        title: "T50: MLX-LM baseline"
        path: ai/worklogs/2026-07-27-T50-mlx-lm-baseline.md
        required: true
        why: >-
          The measured baseline and, more usefully, the timer discipline: pre and
          post fences on the generation stream, and TTFT taken without
          scheduling a later decode.
      - key: runtime
        label: T51 worklog
        title: "T51: custom MLX runtime"
        path: ai/worklogs/2026-07-30-T51-custom-mlx-runtime.md
        required: true
        why: >-
          The runtime that replaces the package: cache allocation, indexed
          updates, GQA attention, and exact reproduction of the T11 oracle
          through both layouts.
      - key: env
        label: M4 environment
        title: "The macOS M4 environment"
        path: environments/macos-m4/README.md
        required: false
        why: The pinned host and MLX baseline environment the numbers belong to.
      - key: backends
        label: Backends package
        title: "Runtime backends"
        path: src/slm_lab/backends/README.md
        required: false
        why: Where the MLX runtime sits among the other backends.
    labs:
      - what: Run the MLX runtime unit tests
        run: uv run pytest tests/mlx/test_cache_runtime.py tests/mlx/test_config.py
        proves: >-
          Cache allocation, indexed updates, and both layouts on small
          configurations — no weights required.
      - what: "Reproduce the oracle on real weights (Apple Silicon, needs the checkpoint)"
        run: uv run pytest tests/mlx/test_real_qwen.py
        proves: >-
          The custom runtime generates 576, 8356, 3950 through both cache
          layouts, matching PyTorch/BF16 exactly.
      - what: Run the MLX-LM baseline regressions
        run: uv run pytest tests/backends/test_mlx_baseline.py
        proves: Checksum verification, canary validation, and drift rejection.
    notebooks:
      - name: 08_mlx_gqa_kv_layout.ipynb
        status: planned
        owner: T80
        focus: GQA-efficient cache layouts and their memory behaviour
      - name: 09_mlx_compile_and_profile.ipynb
        status: planned
        owner: T52
        focus: mx.compile, Instruments, thermal drift — the checkpoint after this
    questions:
      - The runtime stores eight K/V heads and passes them to SDPA unchanged.
        Compute the cache bytes saved at 4,096 tokens versus tiling to sixteen.
      - MLX is lazy. Where exactly must a timer fence go, and what does a
        forgotten fence make TTFT look like?
      - Peak memory was reported identically for every measured region. What are
        two explanations, and how would you tell them apart?
    boundaries:
      - The T50 canary is an 18-token prompt and three output tokens. It is a
        correctness and smoke-performance baseline, not the four-context sweep.
      - Neither task claims ANE use. Profiling and the context sweep are T52.

  - id: LEARN-09
    title: CI as a deployment surface
    subject: A manually dispatched workflow that can touch a paid service
    lede: >-
      The last completed task is the one where a mistake costs money or leaks a
      token. A manual `workflow_dispatch` workflow drives Qualcomm AI Hub with
      typed target, context, precision, and stage inputs, behind an
      authorization job that refuses fork dispatches, a protected environment,
      minimal permissions, pinned actions, and an ephemeral credential file.
    tasks: [T72]
    attention: Hands-on and deep study
    hands_on: >-
      Adding the repository secret and dispatching the workflow are yours alone.
      The guide deliberately stops before the secret step.
    outcomes:
      - Read a workflow file as a program — triggers, jobs, needs, steps,
        inputs, secrets, environments, permissions.
      - Explain why one dispatch runs one stage rather than the whole pipeline.
      - Describe the fork-safety model and what `pull_request_target`-style
        mistakes it avoids.
      - Say what the workflow verifies before it is allowed to spend anything.
    readings:
      - key: guide
        label: Actions guide
        title: "GitHub Actions for Qualcomm AI Hub"
        path: docs/learning/github_actions_for_ai_hub.md
        required: true
        why: >-
          The full guide, including the request-bundle contract, the setup
          section that stops before the secret, the dispatch checklist, and
          failure interpretation.
      - key: workflows
        label: Workflow index
        title: "The repository's workflows"
        path: .github/workflows/README.md
        required: false
        why: What each workflow is for, and which ones can cost money.
      - key: worklog
        label: T72 worklog
        title: "T72: manual GitHub Actions AI Hub workflow"
        path: ai/worklogs/2026-07-30-T72-qualcomm-actions.md
        required: false
        why: >-
          Three rounds of security findings and their remediation — the most
          instructive part is what the first draft got wrong.
    labs:
      - what: Validate the workflow offline
        run: uv run pytest tests/workflows/test_qualcomm_benchmark_workflow.py
        proves: >-
          Typed choices, authorization gating, permission scope, action pinning,
          timeouts, and credential handling — without running Actions.
      - what: Read the workflow beside the guide
        run: uv run python -c "import pathlib,sys; sys.stdout.write(pathlib.Path('.github/workflows/qualcomm-benchmark.yml').read_text())"
        proves: >-
          Every claim in the guide maps to a line you can point at. Find the
          authorization job first.
    notebooks:
      - name: Markdown workflow lab (E10)
        status: planned
        owner: T80
        focus: >-
          CI concepts are exercised against the real repository rather than in
          Jupyter.
    questions:
      - A fork opens a pull request that edits the workflow. Trace every gate
        that stops it from reaching the secret.
      - Why is the AI Hub client configured through a mode-600 ephemeral file
        instead of an environment variable?
      - The workflow can be dispatched with a precision label the pipeline
        cannot yet produce. Is that a bug? Argue both sides.
    boundaries:
      - Nothing has been dispatched and no secret exists. This is a reviewed,
        offline-validated workflow, not evidence of a CI-run job.
      - Local scripts remain the implementation source; the workflow is an
        operator surface over them.

  - id: LEARN-10
    title: Reading a graph before a compiler does
    subject: What an exported graph tells you, and what only a measurement can
    lede: >-
      T20 proved the eight Qwen3 graphs export and match the frozen contract.
      T21 asks the next two questions. A dependency-free protobuf reader walks
      the real graphs and finds a fully static, branch-free, single-domain
      boundary hiding 1,231 computed shape inputs, 56 scatter-based cache
      writes, a 37 MB per-token I/O boundary, and a 33.5 MB causal mask baked
      into one node. Then the graphs are actually run, and the measurement
      lands on the tolerance rather than on the graph: the first real ONNX
      Runtime execution missed thresholds that, it turns out, also reject
      float32. Two very different kinds of evidence, and the second one is a
      lesson in what a threshold is for.
    tasks: [T21, T23]
    attention: Deep study
    outcomes:
      - Explain how a graph can be fully static at its boundary and still be
        hostile to a static-shape compiler.
      - Distinguish a numerical-tolerance failure from a cache state-update
        failure, and say why the second cannot be found by checking one decode
        step.
      - Say why a cache prefix check must be exact rather than tolerant.
      - Read an absent finding correctly, telling "we looked and it is clean"
        apart from "there was nothing to look at".
      - State what a validated mechanism plus a recorded command is worth, and
        what it is not worth, compared to a measurement — then read the
        measurement that arrived and say which parts of the mechanism it
        confirmed and which claim it falsified.
      - Separate re-deriving a tolerance from widening one, and name the single
        control that tells them apart when both produce a green run.
    readings:
      - key: inspection
        label: Graph inspection report
        title: "ONNX graph inspection: the T20 static reference graphs"
        path: docs/results/onnx/graph-inspection.md
        required: true
        why: >-
          The measured report: provenance, method, eight graphs, findings
          ranked by consequence for T22, the rules that stayed silent, and an
          explicit list of what none of it licenses.
      - key: parity
        label: ORT CPU parity report
        title: "ONNX Runtime CPU parity for the T20 reference graphs"
        path: docs/results/onnx/ort-cpu-parity.md
        required: true
        why: >-
          The measurement, and the tolerance derivation it forced: invariants
          named, faults injected, and then a threshold shown to reject float32
          and replaced by one derived from dtype ULP and layer depth. Read the
          derivation section before the results table.
      - key: catalogue
        label: Risk catalogue
        title: "The ONNX deployment-risk rule catalogue"
        path: configs/graph/README.md
        required: false
        why: >-
          What a severity means, which target it is relative to, and why it is
          a review judgement rather than a compiler result.
      - key: worklog
        label: T21 worklog
        title: "T21: ONNX Runtime CPU parity and graph inspection"
        path: ai/worklogs/2026-08-02-T21-ort-cpu-parity-graph-inspection.md
        required: false
        why: >-
          The decisions, including why no ONNX Runtime extra was added to the
          root lock and what the first real parity run must do to the
          tolerances — written before that run happened, so it is also the
          record of a prediction you can now grade.
    labs:
      - what: Run the graph inspection and parity unit tests
        run: uv run pytest tests/onnx
        proves: >-
          The protobuf reader, every detector, and all nine static-cache
          invariants — including seventeen injected faults — and the tolerance
          budget's own guards, with no torch, onnx, onnxruntime, or numpy
          installed.
      - what: Read the tolerance's two-sided property off committed JSON
        run: uv run pytest tests/onnx/test_onnx_cpu_parity.py -k tolerance -v
        proves: >-
          That the committed thresholds accept the exact float32 answer and
          still reject a one-slot cache offset, and that the four logit
          thresholds come from one error budget rather than four knobs.
      - what: Reproduce the committed inspection reports from the real graphs
        run: SLM_LAB_ARTIFACT_ROOT=<external-root> uv run python -m slm_lab.graph.inspection --all-manifests --check
        proves: >-
          Every committed number re-derives from graphs whose SHA-256 matches
          the T20 manifest. Needs the artifact root; exits 0 when current.
      - what: Read the risk catalogue beside the report
        run: uv run python -c "import json,pathlib;d=json.loads(pathlib.Path('configs/graph/onnx-risk-rules-v1.json').read_text());print('\n'.join(f\"{r['id']:32} {r['severity']:14} {r['detector']}\" for r in d['rules']))"
        proves: >-
          Which rule produced which finding, and that severity is carried by
          the catalogue rather than invented per report.
    notebooks:
      - name: 03_graph_inspection.ipynb
        status: planned
        owner: T80
        focus: >-
          Graph risks and rewrites, with the folding experiment this report
          recommends running first.
    questions:
      - Every dimension in all eight graphs is static, yet the top-ranked
        finding is in the dynamic_shape category. Reconcile those two facts,
        then say what a compiler does about it.
      - A decode graph passes step one perfectly and corrupts the cache at step
        three. Name the invariant that catches it and explain why a tolerant
        comparison would not.
      - R-INTERNAL-DYNAMIC-SHAPE did not fire. Argue that this is good news,
        then argue it is no news, and say which is right.
      - Compute the useful fraction of the S4096 decode boundary traffic and
        explain why that ratio decides long-context viability before any kernel
        question does.
      - The parity atol is 4.6x looser than T11's while cosine_min is tighter.
        Justify each from the two error sources the comparison admits, then say
        which side of the comparison is the coarser one and why that decides
        the answer.
      - A measurement misses a threshold and the threshold is then replaced by
        a larger one. Describe the evidence that would make that legitimate,
        and the evidence that would make it misconduct. Then find which of the
        two the committed diagnostics supply.
    boundaries:
      - No compiler, converter, quantizer, or device was run. Every severity is
        a structural judgement about a stated target, not a compile result.
      - The ONNX Runtime measurement is one build (1.28.0), one execution
        provider (CPU), one host, at ORT_DISABLE_ALL. The paired ORT_ENABLE_ALL
        run that would isolate the fusion delta has not been taken.
      - The tolerance is derived and two-sided, not proven correct. It rests on
        a rounding model and a stated margin, and the comparison's coarser side
        is the bfloat16 reference rather than the float16 graph.
      - The reader is a structural decoder, not a validator; T20's onnx.checker
        acceptance remains the evidence that the graphs are valid ONNX.
  - id: LEARN-11
    title: Calibration data as a contract
    subject: Freezing the inputs to quantization before quantizing anything
    lede: >-
      Post-training quantization reads activation ranges off a handful of
      sample inputs and turns them into scales and zero-points. Change the
      inputs and you change the deployed model. So the calibration corpus gets
      the same treatment T10 gave the tokenizer: an exact revision, a frozen
      preprocessing rule, a hash that breaks when either moves, and a licence
      trail. This checkpoint is also where an honest coverage argument is
      separated from a flattering one.
    tasks: [T40]
    attention: Deep study
    outcomes:
      - Explain why calibration inputs are a contract rather than a
        convenience, and what a W8 quality delta means if they are not frozen.
      - Argue why this corpus represents the target workloads, and state
        precisely where that argument stops.
      - Describe why padding was rejected and short fixtures tiled, and what
        the frozen T12 prefill contract had to do with it.
      - Say what "baseline parity checked before quantization" established
        here, and what it deliberately did not.
      - Read a pinned environment and separate what was verified from what was
        merely resolved.
    readings:
      - key: guide
        label: Calibration guide
        title: "Calibration data as a quantization contract"
        path: docs/learning/calibration_and_aimet.md
        required: true
        why: >-
          The full argument, including the coverage limits. Read "What this
          corpus does not license" as carefully as the rationales - it is the
          part that makes the rationales trustworthy.
      - key: contract
        label: The frozen corpus
        title: "T40 calibration corpus contract"
        path: configs/quantization/calibration.yaml
        required: true
        why: >-
          The artifact T41 actually consumes. Read the header, then
          `calibration_corpus.coverage`, and only then the per-sample
          rationales - that order is deliberate.
      - key: environment
        label: AIMET environment
        title: "Linux AIMET environment"
        path: environments/linux-aimet/README.md
        required: false
        why: >-
          A pinned environment for a platform the author could not run. Note
          how "verified" and "unverified" are kept apart, and that every
          unverified row carries the command that would settle it.
      - key: worklog
        label: T40 worklog
        title: "T40: AIMET and calibration environment"
        path: ai/worklogs/2026-08-02-T40-aimet-calibration-environment.md
        required: false
        why: >-
          The decisions and their costs, including why the first draft's
          coverage rationales had to be rewritten.
    labs:
      - what: Prove the corpus is a fixed point
        run: uv run python -m slm_lab.quantization.calibration check
        proves: >-
          The committed contract regenerates byte-for-byte from the T10
          fixtures. Then change one token count in a copy and watch which
          guard rejects it.
      - what: Re-verify the floating baseline
        run: uv run python -m slm_lab.quantization.parity verify
        proves: >-
          The T20 export is still the artifact its manifests claim. Read the
          verdict carefully - exit 0 is not full parity, and the scope field
          says why.
      - what: Recompute the corpus revision by hand
        run: uv run python -c "import hashlib,json,yaml; c=yaml.safe_load(open('configs/quantization/calibration.yaml'))['calibration_corpus']; print(hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest())"
        proves: >-
          The revision is over exactly the block that determines the inputs, so
          a prose edit cannot silently change it.
    notebooks:
      - name: 06_w8_w4_calibration.ipynb
        status: planned
        owner: T80
        focus: >-
          Calibration and W8/W4 behaviour, built on the corpus frozen here.
    questions:
      - The corpus touches 175 of 151,936 embedding rows. Why is that not
        automatically a defect, and what would make it one?
      - Padding a short prompt is the obvious way to reach a fixed length.
        Give both the mechanical and the statistical reason it was rejected.
      - Four samples are calibrated on and evaluated on. What does that do to a
        reported quality delta, and how should T41 report it?
      - The parity gate exits 0 while its verdict reads `partial`. Argue that
        this is correct, then argue that it is a trap.
    boundaries:
      - No weight was quantized and AIMET was never executed. This is a frozen
        input contract and a pinned environment, not quantization evidence.
      - The environment is verified as a dependency resolution, not as a
        working installation; no wheel was installed on any host.
      - Only artifact-identity parity was measured. Numerical logit parity
        between the PyTorch reference and the ONNX export remains unrun and is
        owned by T21.
  - id: LEARN-12
    title: Rewriting a graph for a compiler you have not run
    subject: What a transformation catalogue can prove, and where the proof stops
    lede: >-
      T21 ranked what is wrong with the eight reference graphs. T22 rewrites
      them and measures what changed. Six declarative passes turn 7,634 prefill
      nodes into 2,785, collapse a 9.70x protobuf spread to 1.01x, and take the
      rank-1 shape finding from 804 to at most 6 — while the boundary, the 56
      cache writes, the 285 precision crossings and the 367 sensitive operators
      stay exactly where the export put them. Then the candidates are executed,
      and every logit comes back bit-identical to the reference. The two
      instructive parts are the transformation this catalogue *refused*, on
      four measured grounds, and the follow-up that closed a T21 evidence
      boundary and closed it unfavourably.
    tasks: [T22]
    attention: Deep study
    outcomes:
      - Explain why a rewrite catalogue must be declarative, ordered, and
        target-neutral, and what each of those three words rules out.
      - Read a pass ordering as a dependency argument, naming which passes
        cannot work until an earlier one has run, and why.
      - Distinguish a smaller finding count from a more convertible graph, and
        say what evidence would be needed for the second.
      - Argue why bit-identical logits are the expected result of a
        semantics-preserving catalogue, and what a one-ULP difference would
        have meant.
      - Judge an optimizer by the objective it was built for rather than by the
        node count it reports, and name the artifacts a host-specific optimizer
        leaves behind.
      - Say precisely what "ready for submission" is allowed to mean before any
        service has been contacted.
    readings:
      - key: report
        label: QNN candidate report
        title: "The T22 QNN candidate graphs: what six rewrites did"
        path: docs/results/qualcomm/qnn-candidates.md
        required: true
        why: >-
          The measured report: provenance, the six passes with one graph walked
          end to end, the before/after matrix, the rejected pass with its four
          grounds, the parity result, and an explicit list of what none of it
          licenses. Read section 1 and section 10 before the tables.
      - key: catalogue
        label: The transformation catalogue
        title: "qnn-candidate-v1"
        path: configs/graph/qnn-transforms-v1.json
        required: true
        why: >-
          The artifact the build tool actually consumes. Read `target_context`
          first, then each pass's `observed_issue` before its `transformation`
          - the order is deliberate, because a pass with no cited finding is a
          preference rather than a fix. The rejected pass is the last entry.
      - key: manifests
        label: Candidate manifests
        title: "T22 QNN candidate manifests"
        path: results/manifests/qnn/README.md
        required: true
        why: >-
          What each committed manifest holds, what the build tool does in
          order, and what `--check` proves and does not. The section on the
          rejected transformation records a number that disagreed with the
          planning probe, and says the cause is not known rather than guessing
          one.
      - key: packaging
        label: Packaging and preflight
        title: "QNN candidate packaging and the offline compile preflight"
        path: src/slm_lab/deployment/README.md
        required: false
        why: >-
          The package layout, why one directory per graph kind is a
          requirement rather than tidiness, and the three things "ready for
          submission" is allowed to mean.
      - key: worklog
        label: T22 worklog
        title: "T22: QNN candidates and packaging"
        path: ai/worklogs/2026-08-03-T22-qnn-candidates-and-packaging.md
        required: false
        why: >-
          The decisions and their costs, including why the reference-graph
          parity runner was generalized rather than duplicated, and why the
          task was not marked completed.
    labs:
      - what: Run the transform-engine and packaging tests
        run: uv run pytest tests/qnn tests/deployment/qualcomm
        proves: >-
          The catalogue loader's own guards, every pass's positive and negative
          cases, the package builder, and the offline compile preflight. The
          `onnx`-dependent cases skip in the locked root environment, which has
          no `onnx`, `onnxruntime`, or `numpy` - that absence is deliberate.
      - what: Prove the candidate logits are bit-identical to the reference
        run: uv run python -c "import json;[print(v,all(a['candidate_logits_sha256']==b['candidate_logits_sha256'] for a,b in zip(json.load(open(f'results/manifests/qnn/parity/{v}-ort-cpu.json'))['steps'],json.load(open(f'results/graph/parity/{v}-ort-cpu.json'))['steps']))) for v in ('S128','S512','S1024','S4096')]"
        proves: >-
          Every one of the 20 recorded steps produced the same logit digest on
          the candidate as on the reference. Then read `graph_digests` in both
          files and confirm the two runs loaded different bytes.
      - what: Read the rejected pass's evidence off committed JSON
        run: uv run python -c "import json;d=json.load(open('results/manifests/qnn/S4096.json'));r=[t for t in d['transformations'] if not t['applied']][0]['rejection_evidence']['prefill'];print(r['node_count'],r['protobuf_bytes'],r['operator_histogram_delta']['Softmax'],r['operator_histogram_delta']['Cast'],len(r['added_opset_domains_used_by_no_node']))"
        proves: >-
          The four grounds in one line: the node count really does fall, the
          protobuf really is 1,811,439,962 bytes, `Softmax` really goes to
          zero, `Cast` really more than doubles, and all eight added domains
          are used by no node.
      - what: Reproduce the committed manifests from the real graphs
        run: SLM_LAB_ARTIFACT_ROOT=<external-root> <onnx-env-python> -m slm_lab.graph.qnn.build --all-manifests --check
        proves: >-
          Every committed number re-derives from reference bytes whose SHA-256
          matches the T20 manifest, down to the candidate digests. Needs the
          artifact root and an environment with `onnx`, `onnxruntime` and
          `numpy`; exits 0 when current. It re-reads the parity record; it does
          not re-measure it.
    notebooks:
      - name: 03_graph_inspection.ipynb
        status: planned
        owner: T80
        focus: >-
          Graph risks and the rewrites that answer them, with the folding
          experiment run against a graph you can re-inspect.
    questions:
      - Pass 1 changes no value and no edge. Explain why every other pass
        depends on it, and what would have happened to the S4096 causal mask
